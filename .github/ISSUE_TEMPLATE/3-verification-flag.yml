name: Flag an entry for re-verification
description: Mark a pattern or composition aspect that needs systematic re-checking
title: "Re-verify <aspect> on <id>"
labels: ["verification"]
body:
  - type: markdown
    attributes:
      value: |
        `verification-todo.json` is how the catalog stays honest over time. Every pattern and composition
        carries per-aspect statuses (`todo` / `pass` / `fail` / `na`) — intent length, references live,
        edges correct, evidence quoted. The full aspect list is in that file's `aspect_definitions` block.

        Use this form when an upstream change (a moved URL, a renamed framework, a rewritten doc)
        invalidates something that was previously checked, and you do not want to fix it yourself right now.

  - type: input
    id: entry_id
    attributes:
      label: Pattern or composition id
      placeholder: production-rag
    validations:
      required: true

  - type: input
    id: aspect
    attributes:
      label: Aspect
      description: The aspect key from `aspect_definitions` in `verification-todo.json`.
      placeholder: references_live
    validations:
      required: true

  - type: dropdown
    id: proposed_status
    attributes:
      label: Proposed status
      options:
        - "fail — it is definitely wrong"
        - "todo — a previous pass is no longer trustworthy"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What changed
      description: What made the previous check stale or wrong? Link the upstream change if you have it.
    validations:
      required: true
