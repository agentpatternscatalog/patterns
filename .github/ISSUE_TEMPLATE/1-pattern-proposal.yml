name: Pattern proposal
description: Propose a new pattern or anti-pattern for the catalog
title: "Add <Pattern Name> pattern"
labels: ["pattern-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a pattern. You do **not** need to author the full entry — a well-evidenced
        proposal is useful on its own and can be picked up later.

        Before filling this in, please skim the three admission rules in
        [CONTRIBUTING.md](https://github.com/agentpatternscatalog/patterns/blob/main/CONTRIBUTING.md#what-counts-as-a-pattern).
        The fields below mirror the required slots in `schema.json`, so a complete proposal can be
        authored into `patterns-src/` with little back-and-forth.

  - type: input
    id: pattern_id
    attributes:
      label: Proposed id
      description: Lower-case kebab-case, unique across the catalog. Check `INDEX.md` for collisions.
      placeholder: step-budget-governor
    validations:
      required: true

  - type: input
    id: pattern_name
    attributes:
      label: Proposed name
      description: Prefer the canonical name from the literature where one exists; note alternatives as aliases.
      placeholder: Step Budget Governor
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - pattern
        - anti-pattern
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Best guess is fine; maintainers may re-classify. See `docs/taxonomy.md`.
      options:
        - planning-control-flow
        - tool-use-environment
        - memory
        - multi-agent
        - verification-reflection
        - safety-control
        - routing-composition
        - governance-observability
        - structure-data
        - streaming-ux
        - reasoning
        - retrieval
        - cognition-introspection
        - anti-patterns
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Intent (exactly one sentence)
      description: If you cannot say it in one sentence, this is probably two patterns.
      placeholder: Halt an agent loop after a fixed number of tool calls, regardless of whether the goal was reached.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The recurring problem, in plain sentences rather than bullets. What goes wrong without this pattern?
    validations:
      required: true

  - type: textarea
    id: constrains
    attributes:
      label: What does it constrain?
      description: >
        Name the one thing the model is forbidden to do under this pattern. This is required by
        convention and checked at review (rule A3). A pattern that does not constrain the model is decoration.
      placeholder: The step budget halts the loop after N tool calls; the model cannot extend its own budget.
    validations:
      required: true

  - type: textarea
    id: applicability
    attributes:
      label: When to use / when not to use
      description: Two short lists. The "do not use when" half matters as much as the other one.
      value: |
        **Use when:**
        -

        **Do not use when:**
        -
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        At least one of: a linked paper (authors and year), a publicly visible product that ships it,
        or a working open repository. Nothing is admitted on speculation. Please paste a short
        supporting quote with each link where you can.
      placeholder: |
        - Paper: https://arxiv.org/abs/... — Author et al., 2025. "quote that shows the mechanism"
        - Product: https://... — "quote from the docs"
        - Repo: https://github.com/...
    validations:
      required: true

  - type: textarea
    id: known_uses
    attributes:
      label: Known uses
      description: Systems, frameworks, or products you know ship this. One per line.
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related patterns
      description: >
        Existing catalog ids this connects to, and how. Relations are `complements`, `alternative-to`,
        `specialises`, `generalises`, `uses`, `used-by`, `composes-with`, `conflicts-with`.
      placeholder: |
        - step-budget — alternative-to
        - decision-log — complements
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: Admission rules
      options:
        - label: This names a recurring problem across products and years, not a single vendor's feature.
          required: true
        - label: I have linked at least one paper, shipping product, or open repository above.
          required: true
        - label: I searched `INDEX.md` and this is not already in the catalog under another name.
          required: true

  - type: checkboxes
    id: offer
    attributes:
      label: Optional
      options:
        - label: I would like to author the full entry myself (a maintainer will confirm the naming first).
          required: false
