name: Correction to an existing entry
description: Report something wrong in a pattern, composition, example, or doc
title: "Fix <what> on <pattern-id>"
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for anything already in the catalog that is wrong: a dead or moved link, a misattributed
        reference, a wrong or missing related-pattern edge, a code example that does not match its
        `source_url`, or prose that misdescribes the mechanism.

        Small fixes do not need an issue first — a pull request is welcome straight away.

  - type: input
    id: entry_id
    attributes:
      label: Affected id(s)
      description: Pattern, composition, or example ids. Comma-separated if more than one.
      placeholder: cross-encoder-reranking
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Dead or moved URL
        - Wrong or misattributed reference
        - Wrong / missing related-pattern edge
        - Code example does not match its source
        - Prose misdescribes the mechanism
        - Schema or lint failure
        - Other
    validations:
      required: true

  - type: textarea
    id: whats_wrong
    attributes:
      label: What is wrong
      description: Quote the current text or link, and say what it should be.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The replacement link, the correct citation, or the upstream source that shows the current text is wrong.
    validations:
      required: false

  - type: checkboxes
    id: offer
    attributes:
      label: Optional
      options:
        - label: I am willing to open a pull request for this fix.
          required: false
